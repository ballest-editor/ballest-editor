packages:
  - "apps/*"
  - "packages/*"
  - "tools/extract"

allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  msw: false
  dprint: false
  # Its postinstall downloads the binary; `pnpm --filter @ballest/desktop ensure:electron` does that on demand,
  # so installs that never launch the app (lint, typecheck, the web build) skip the ~100 MB download.
  electron: false

minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.61.0"
  - "@effect/tsgo-darwin-x64@0.61.0"
  - "@effect/tsgo-linux-arm64@0.61.0"
  - "@effect/tsgo-linux-arm@0.61.0"
  - "@effect/tsgo-linux-x64@0.61.0"
  - "@effect/tsgo-win32-arm64@0.61.0"
  - "@effect/tsgo-win32-x64@0.61.0"
  - "@effect/tsgo@0.61.0"
