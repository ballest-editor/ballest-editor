name: App driver

# Its own workflow so these paths can skip it: docs and other tools have no states to run. It isn't a required check.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "tools/app-driver/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/app-driver.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "tools/app-driver/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/app-driver.yml"
      - "!**/*.md"

concurrency:
  group: app-driver-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-driver:
    name: app-driver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: sudo apt-get update && sudo apt-get install -y xvfb

      # google-chrome is on the runner image. Web and desktop states at their default axes, on software WebGL.
      - run: pnpm app-driver run --smoke --jobs 3 --name ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: app-driver
          path: |
            .app-driver/runs/ci
            .app-driver/logs
          include-hidden-files: true
