name: Conventional titles

# PR titles become the commit subject on main (squash merge), so they follow
# Conventional Commits; the `commitlint` key in package.json is the single source of rules.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: conventional-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: conventional title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose

  # Issues can't be blocked, so a non-conventional title gets a label and one comment.
  issue-title:
    name: conventional issue title
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      HUSKY: "0"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
      TITLE: ${{ github.event.issue.title }}
      LABEL: "title: not conventional"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Label or unlabel the issue
        run: |
          if printf '%s\n' "$TITLE" | pnpm exec commitlint > lint.txt 2>&1; then
            gh issue edit "$NUMBER" --remove-label "$LABEL" || true
          elif ! gh issue view "$NUMBER" --json labels --jq '.labels[].name' | grep -qxF "$LABEL"; then
            gh issue edit "$NUMBER" --add-label "$LABEL"
            {
              echo 'Issue titles follow [Conventional Commits](https://www.conventionalcommits.org), like `fix: gizmo jumps on mirrored items` or `feat(palette): search by asset name`.'
              echo
              echo '```'
              cat lint.txt
              echo '```'
            } > comment.md
            gh issue comment "$NUMBER" --body-file comment.md
          fi
