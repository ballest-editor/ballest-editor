name: Release desktop

# One platform's installer, from the bundle release.yml's build_bundle job uploaded. Called once per platform.
on:
  workflow_call:
    inputs:
      platform:
        description: win or linux (tools/release/src/config.ts)
        required: true
        type: string
      runner:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: package (${{ inputs.platform }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Only the release tool: the app is already built.
      - run: pnpm install --frozen-lockfile --filter @ballest/release...

      # apps/web/dist, apps/desktop/dist-electron and web-assets/, where the build left them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle

      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
        run: >-
          node tools/release/src/main.ts desktop
          --platform "$PLATFORM" --app-version "$VERSION" --skip-build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ inputs.platform }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7
          # The installers are already compressed.
          compression-level: 0
