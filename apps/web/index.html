<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ballest Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The room the saved layout leaves around the centre group (the key is domain/dockLayout.ts's) as --dock-<side>
      // on <html> before first paint, so the loading skeleton lays out like the dock will.
      try {
        var hint = JSON.parse(localStorage.getItem("ballest-editor.dock.v1")).hint
        for (var side in hint) document.documentElement.style.setProperty("--dock-" + side, hint[side] + "px")
      } catch (e) {}
    </script>
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
