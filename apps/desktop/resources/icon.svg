<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon: a ball resting on an isometric grid block. Also the web favicon (apps/web/public/favicon.svg). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3040"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#5a7fb8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5a7fb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>

    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63c0f3"/>
      <stop offset="1" stop-color="#2f86c4"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a74b8"/>
      <stop offset="1" stop-color="#174878"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17528a"/>
      <stop offset="1" stop-color="#092a4c"/>
    </linearGradient>
    <linearGradient id="frontEdge" gradientUnits="userSpaceOnUse" x1="0" y1="414" x2="0" y2="468">
      <stop offset="0" stop-color="#d9efff"/>
      <stop offset="1" stop-color="#9fc9ea"/>
    </linearGradient>
    <clipPath id="topClip">
      <path d="M256 230L440 322L256 414L72 322Z"/>
    </clipPath>
    <clipPath id="sideClip">
      <path d="M72 322L256 414L256 468L72 376Z"/>
      <path d="M440 322L256 414L256 468L440 376Z"/>
    </clipPath>

    <radialGradient id="ball" cx="0.36" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#ffe3de"/>
      <stop offset="0.14" stop-color="#ff6f66"/>
      <stop offset="0.55" stop-color="#e8242f"/>
      <stop offset="0.86" stop-color="#8c0f1b"/>
      <stop offset="1" stop-color="#5e0912"/>
    </radialGradient>
    <radialGradient id="bounce" cx="0.5" cy="1.02" r="0.62">
      <stop offset="0" stop-color="#5fb8ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#5fb8ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5fb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fresnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="specular" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="specular2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#vignette)"/>
    <path d="M82 384L256 478L430 384L256 346Z" fill="#000" fill-opacity="0.55" filter="url(#blur18)"/>
  </g>

  <!-- Block: faces, grid lines, edges (every line drawn inside the faces) -->
  <path d="M72 322L256 414L256 468L72 376Z" fill="url(#leftFace)"/>
  <path d="M440 322L256 414L256 468L440 376Z" fill="url(#rightFace)"/>
  <path d="M256 230L440 322L256 414L72 322Z" fill="url(#topFace)"/>
  <g clip-path="url(#sideClip)">
    <path d="M118 345v54M164 368v54M210 391v54M302 391v54M348 368v54M394 345v54" stroke="#6fa9d8" stroke-width="3" fill="none"/>
  </g>
  <g clip-path="url(#topClip)">
    <path d="M118 299L302 391M164 276L348 368M210 253L394 345M394 299L210 391M348 276L164 368M302 253L118 345" stroke="#b9e0f7" stroke-width="3" fill="none"/>
  </g>
  <path d="M254.5 413.25L257.5 413.25L257.5 467.25L256 468L254.5 467.25Z" fill="url(#frontEdge)"/>
  <path d="M72 322L75 320.5L75 377.5L72 376Z" fill="#a9d3f0"/>
  <path d="M440 322L437 320.5L437 377.5L440 376Z" fill="#7fb0d8"/>
  <path d="M256 230L440 322L256 414L72 322ZM256 233.4L433.2 322L256 410.6L78.8 322Z" fill="#e6f5ff" fill-rule="evenodd"/>

  <!-- Ball and its shadow -->
  <ellipse cx="278" cy="326" rx="102.9" ry="45.1" fill="#031a33" fill-opacity="0.6" filter="url(#blur8)"/>
  <ellipse cx="262" cy="324" rx="58.8" ry="23.5" fill="#02101f" fill-opacity="0.7" filter="url(#blur3)"/>
  <circle cx="256" cy="228" r="98" fill="url(#ball)"/>
  <circle cx="256" cy="228" r="98" fill="url(#bounce)"/>
  <circle cx="256" cy="228" r="98" fill="url(#fresnel)"/>
  <ellipse cx="220.7" cy="182.9" rx="27.4" ry="16.7" transform="rotate(-36 220.7 182.9)" fill="url(#specular)"/>
  <circle cx="307" cy="210.4" r="9.8" fill="url(#specular2)"/>

  <!-- Rim light on the tile's top edge -->
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
